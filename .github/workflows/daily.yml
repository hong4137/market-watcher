name: daily-watch
on:
  schedule:
    - cron: '30 10 * * 2-6'   # 화~토 10:30 UTC = 미국 전 거래일 마감 후 (한국 19:30)
  workflow_dispatch: {}        # 수동 실행 버튼

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: run pipeline
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC }}
        run: python pipeline/run_daily.py
      - name: commit results (keepalive 겸용 — 60일 비활성 방지)
        run: |
          git config user.name 'watch-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add -A
          git commit -m "watch $(date -u +%F)" || git commit --allow-empty -m "keepalive $(date -u +%F)"
          git push
