name: collect-history
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: collect
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python pipeline/collect_history.py
      - name: commit
        run: |
          git config user.name 'collect-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add -A
          git commit -m "ext history collect $(date -u +%F)" || echo "no changes"
          git push
